services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asmi
      POSTGRES_PASSWORD: asmi_secret
      POSTGRES_DB: asmi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ASMI_DATABASE_URL: postgresql+psycopg://asmi:asmi_secret@db:5432/asmi
      ASMI_SECRET_KEY: ${ASMI_SECRET_KEY:-dev-secret-change-me}
      ASMI_ENV: development
      ASMI_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ASMI_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
